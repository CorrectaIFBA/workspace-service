name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  IMAGE: docker.correcta.staily.dev/correcta/workspace-service

jobs:
  build-and-publish:
    runs-on: correcta-prod
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: build and push
        run: |
          docker build -t "$IMAGE:${{ steps.meta.outputs.tag }}" .
          docker push "$IMAGE:${{ steps.meta.outputs.tag }}"

      - id: gitops
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: CorrectaIFBA
          repositories: infra

      - uses: actions/checkout@v4
        with:
          repository: CorrectaIFBA/infra
          token: ${{ steps.gitops.outputs.token }}
          path: infra

      # No staging overlay for this app: the tag goes straight to production.
      - name: bump production image tag
        working-directory: infra/apps/correcta-workspace-service/overlays/production
        run: |
          sed -i "s|newTag: .*|newTag: ${{ steps.meta.outputs.tag }}|" kustomization.yaml

      - name: commit
        working-directory: infra
        run: |
          git config user.name "correcta-gitops[bot]"
          git config user.email "322621869+correcta-gitops[bot]@users.noreply.github.com"
          git add apps/correcta-workspace-service/overlays/production
          git diff --cached --quiet && exit 0
          git commit -m "deploy(correcta): production ${{ steps.meta.outputs.tag }}"
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push && exit 0
            sleep $(( RANDOM % 10 + 3 ))
          done
          exit 1
