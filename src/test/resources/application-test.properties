spring.datasource.url=jdbc:h2:mem:workspacedb;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
clients.assessment-service.url=http://127.0.0.1:0
# The migrations are PostgreSQL SQL; tests on H2 build the schema from the entities instead.
spring.flyway.enabled=false
# No broker in tests: listeners stay stopped and the relay never runs (its query is PostgreSQL-only).
spring.rabbitmq.addresses=amqp://guest:guest@127.0.0.1:1
spring.rabbitmq.listener.simple.auto-startup=false
outbox.relay-interval-ms=3600000

