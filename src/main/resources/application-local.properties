# Local development overrides. Activate with SPRING_PROFILES_ACTIVE=local.

spring.datasource.url=${ENV_DATASOURCE_POSTGRES_URL:jdbc:postgresql://localhost:5432/workspace_service}
spring.datasource.username=${ENV_DATASOURCE_POSTGRES_USERNAME:correcta}
spring.datasource.password=${ENV_DATASOURCE_POSTGRES_PASSWORD:local-correcta}

spring.jpa.show-sql=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

clients.assessment-service.url=${ENV_ASSESSMENT_SERVICE_URL:http://127.0.0.1:8086}
