spring.application.name=workspace-service

# === PostgreSQL ===
spring.datasource.url=${ENV_DATASOURCE_POSTGRES_URL}
spring.datasource.username=${ENV_DATASOURCE_POSTGRES_USERNAME}
spring.datasource.password=${ENV_DATASOURCE_POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA ===
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=${ENV_JPA_DDL_AUTO:validate}

# === Flyway ===
# Databases built by ddl-auto=update before Flyway are baselined at 0.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=false

# === SpringDoc OpenAPI ===
springdoc.api-docs.enabled=${ENV_SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${ENV_SPRINGDOC_ENABLED:false}

# === Actuator ===
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# === Assessment-service (Feign, direct in-cluster call) ===
clients.assessment-service.url=${ENV_ASSESSMENT_SERVICE_URL}
spring.cloud.openfeign.client.config.assessment-service.connect-timeout=${ENV_ASSESSMENT_SERVICE_CONNECT_TIMEOUT_MS:2000}
spring.cloud.openfeign.client.config.assessment-service.read-timeout=${ENV_ASSESSMENT_SERVICE_READ_TIMEOUT_MS:5000}
