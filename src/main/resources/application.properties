spring.application.name=workspace-service

# === PostgreSQL ===
spring.datasource.url=${ENV_DATASOURCE_POSTGRES_URL}
spring.datasource.username=${ENV_DATASOURCE_POSTGRES_USERNAME}
spring.datasource.password=${ENV_DATASOURCE_POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA ===
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=${ENV_JPA_DDL_AUTO:validate}

# === Flyway ===
# Databases built by ddl-auto=update before Flyway are baselined at 0.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=false

# === SpringDoc OpenAPI ===
springdoc.api-docs.enabled=${ENV_SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${ENV_SPRINGDOC_ENABLED:false}

# === Actuator ===
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# === Assessment-service (Feign, direct in-cluster call) ===
clients.assessment-service.url=${ENV_ASSESSMENT_SERVICE_URL}
spring.cloud.openfeign.client.config.assessment-service.connect-timeout=${ENV_ASSESSMENT_SERVICE_CONNECT_TIMEOUT_MS:2000}
spring.cloud.openfeign.client.config.assessment-service.read-timeout=${ENV_ASSESSMENT_SERVICE_READ_TIMEOUT_MS:5000}

# === RabbitMQ (session events with assessment-service, published through the outbox) ===
spring.rabbitmq.addresses=${ENV_RABBITMQ_URL}
# The outbox relay waits for the broker's confirm before marking a row published.
spring.rabbitmq.publisher-confirm-type=simple
# A failing message is retried in place, then dead-lettered to <queue>.dlq instead of requeued forever.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=${ENV_RABBITMQ_LISTENER_MAX_ATTEMPTS:5}
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=30000ms
outbox.relay-interval-ms=${ENV_OUTBOX_RELAY_INTERVAL_MS:1000}
